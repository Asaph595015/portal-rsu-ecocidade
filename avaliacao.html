<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação do site EcoCidade</title>
<style>
:root{--bg:#f4f8f4;--card:#fff;--tx:#17301f;--mut:#5b7263;--g:#1f6b3a;--g2:#e3f1e6;--bd:#d5e3d8;--y:#fff6d6;--red:#b3261e;--blue:#8a5a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a13;--card:#16251b;--tx:#e6f1e8;--mut:#9fb5a6;--g:#5cc183;--g2:#1d3526;--bd:#2a4132;--y:#3a3416;--red:#f08a82;--blue:#f0c36a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--g);color:#fff}
.top a{color:#fff;text-decoration:none;font-size:14px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:16px}
.intro{background:var(--g);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
.intro h1{margin:0 0 6px;font-size:22px}.intro p{margin:0;opacity:.92}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;width:100%;display:block;text-align:left;color:inherit}
.card h3{margin:0 0 10px;font-size:16px}.card h2{margin:0 0 6px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{font:inherit;font-size:14px;padding:10px 4px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.opt.on.m{background:var(--g2);border-color:var(--g)}.opt.on.a{background:var(--y);border-color:#d9a400}.opt.on.r{background:#fde4e2;border-color:var(--red);color:#6b0f0a}
textarea,input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:10px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.pl{flex:1;font-size:14px}.pw{height:8px;background:var(--g2);border-radius:99px;margin-top:6px;overflow:hidden}.pb{height:100%;background:var(--g);transition:width .2s}
.send{font:inherit;font-weight:600;background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.send:disabled{opacity:.4;cursor:not-allowed}
.center{text-align:center}.center>*{margin-top:10px}
.center .send,.center .ghost{display:block;width:100%}
.ghost{font:inherit;background:transparent;color:var(--g);border:2px solid var(--g);border-radius:12px;padding:11px 18px;cursor:pointer;text-decoration:none;text-align:center}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center}
.chip b{display:block;font-size:24px}.chip span{font-size:12px;color:var(--mut)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--g2);color:var(--g);white-space:nowrap}
.tag.a{background:var(--y);color:var(--blue)}.tag.r{background:#fde4e2;color:#8c1d18}.tag.n{background:var(--bg);color:var(--mut)}
.li{padding:10px 0;border-top:1px solid var(--bd)}.li:first-of-type{border-top:0}.li p{margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd);font-size:15px}
.mut{color:var(--mut)}
.acts{display:grid;gap:8px;margin-top:6px}
.item{cursor:pointer;font:inherit}.item span{display:block;font-size:13px}
@media print{.top,#bar,.acts{display:none}body{padding:0}}
</style>
</head>
<body>
<header class="top"><b>🌿 EcoCidade</b><span><a href="#resultados">📊 Resultados</a> <a href="index.html" target="_blank" rel="noopener">Abrir o site ↗</a></span></header>
<main id="app"></main>
<div id="bar"></div>
<script>
// Para o WhatsApp abrir direto no seu contato, coloque o número com DDI e DDD. Ex.: "5551999999999"
const WHATS="";
const SEC=["Início e apresentação","Indicadores de impacto","Mapa e pontos de coleta","Calendário de coleta por CEP","Guia de descarte","Transparência e relatórios","Área do cidadão","Área para empresas"];
const DEC={M:["👍","Manter","m"],A:["✏️","Ajustar","a"],R:["🗑","Retirar","r"]};
const app=document.getElementById("app"),bar=document.getElementById("bar");
let ans=SEC.map(()=>({d:"",c:""})),nome="",falta="";
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const when=t=>new Date(t).toLocaleString("pt-BR");
function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function dec(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const s=atob(t);return JSON.parse(new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0))));}
const base=()=>location.href.split("#")[0];
function load(){try{return JSON.parse(localStorage.getItem("eco_aval")||"[]");}catch(e){return [];}}
function save(p){try{const l=load();if(!l.some(x=>x.t===p.t&&x.n===p.n)){l.unshift(p);localStorage.setItem("eco_aval",JSON.stringify(l.slice(0,50)));}}catch(e){}}
function count(p){const c={M:0,A:0,R:0,N:0};p.s.forEach(x=>c[x[0]||"N"]++);return c;}
function copy(t,b){const ok=()=>{const o=b.textContent;b.textContent="Copiado ✓";setTimeout(()=>b.textContent=o,1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>prompt("Copie:",t));}else prompt("Copie:",t);}

function viewForm(){
  bar.style.display="flex";app.textContent="";
  const intro=$("div","intro");
  intro.append($("h1",null,"Avaliação rápida do site"),$("p",null,"Navegue pelo site e marque cada seção: manter, ajustar ou retirar. Leva cerca de 1 minuto."));
  app.append(intro);
  SEC.forEach((nm,i)=>{
    const card=$("section","card"),row=$("div","btns"),ta=$("textarea");
    card.append($("h3",null,String(i+1).padStart(2,"0")+" · "+nm));
    ta.placeholder="O que mudar? (opcional)";ta.rows=2;ta.value=ans[i].c;
    ta.hidden=!(ans[i].d==="A"||ans[i].d==="R");
    ta.oninput=()=>{ans[i].c=ta.value;};
    Object.keys(DEC).forEach(k=>{
      const b=$("button","opt "+DEC[k][2],DEC[k][0]+" "+DEC[k][1]);b.type="button";
      if(ans[i].d===k)b.classList.add("on");
      b.onclick=()=>{ans[i].d=k;row.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));b.classList.add("on");ta.hidden=k==="M";prog();};
      row.append(b);
    });
    card.append(row,ta);app.append(card);
  });
  const f=$("section","card"),t1=$("textarea"),n1=$("input");
  f.append($("h3",null,"Para finalizar"));
  t1.placeholder="Falta algo no site? (opcional)";t1.rows=3;t1.value=falta;t1.oninput=()=>{falta=t1.value;};
  n1.placeholder="Seu nome (opcional)";n1.value=nome;n1.oninput=()=>{nome=n1.value;};
  f.append(t1,n1);app.append(f);prog();
}
function prog(){
  const n=ans.filter(a=>a.d).length;bar.textContent="";
  const w=$("div","pw"),pb=$("div","pb"),l=$("div","pl"),b=$("button","send","Enviar avaliação");
  pb.style.width=(n/SEC.length*100)+"%";w.append(pb);
  l.append($("span",null,n+" de "+SEC.length+" avaliadas"),w);
  b.disabled=!n;b.onclick=done;bar.append(l,b);
}
function done(){
  const p={t:Date.now(),n:nome.trim(),f:falta.trim(),s:ans.map(a=>[a.d,a.d==="M"?"":a.c.trim()])};
  const code=enc(p),link=base()+"#r="+code;
  bar.style.display="none";app.textContent="";scrollTo(0,0);
  const c=$("section","card center");
  c.append($("h2",null,"Obrigado pela avaliação! ✅"),$("p",null,"Agora é só enviar as respostas para quem preparou o site."));
  const msg="Avaliação do site EcoCidade ("+p.s.filter(x=>x[0]).length+" de "+SEC.length+" seções)\n"+link;
  const wa=$("a","send","Enviar por WhatsApp");wa.href="https://wa.me/"+WHATS+"?text="+encodeURIComponent(msg);wa.target="_blank";wa.rel="noopener";
  const cp=$("button","ghost","Copiar link");cp.onclick=()=>copy(link,cp);
  const rs=$("button","ghost","📊 Ver resultado");rs.onclick=()=>{location.hash="r="+code;};
  const bk=$("button","ghost","Voltar e editar");bk.onclick=viewForm;
  c.append(wa,cp,rs,bk);app.append(c);
}
function report(p){
  const c=count(p);
  let t="RELATÓRIO DE AVALIAÇÃO - ECOCIDADE\n"+(p.n||"Cliente sem nome")+" - "+when(p.t)+"\nManter: "+c.M+" | Ajustar: "+c.A+" | Retirar: "+c.R+" | Não avaliadas: "+c.N+"\n\n";
  p.s.forEach((x,i)=>{t+=(i+1)+". "+SEC[i]+": "+(x[0]?DEC[x[0]][1]:"Não avaliada")+(x[1]?" - "+x[1]:"")+"\n";});
  if(p.f)t+="\nFalta algo: "+p.f+"\n";
  return t;
}
function viewResult(p){
  bar.style.display="none";app.textContent="";scrollTo(0,0);
  const c=count(p),h=$("div","intro"),chips=$("div","chips");
  h.append($("h1",null,"Resultado da avaliação"),$("p",null,(p.n||"Cliente sem nome")+" · "+when(p.t)));
  app.append(h);
  [["M","Manter"],["A","Ajustar"],["R","Retirar"],["N","Não avaliadas"]].forEach(x=>{
    const e=$("div","chip");e.append($("b",null,String(c[x[0]])),$("span",null,x[1]));chips.append(e);});
  app.append(chips);
  const todo=$("section","card");todo.append($("h3",null,"Modificações a fazer"));
  let any=false;
  p.s.forEach((x,i)=>{
    if(x[0]==="A"||x[0]==="R"){any=true;const li=$("div","li");
      li.append($("span","tag "+x[0].toLowerCase(),DEC[x[0]][1]),$("b",null," "+SEC[i]),x[1]?$("p",null,x[1]):$("p","mut","Sem comentário."));
      todo.append(li);}
  });
  if(!any)todo.append($("p","mut","Nenhuma alteração pedida."));
  if(p.f)todo.append($("h3",null,"Falta algo?"),$("p",null,p.f));
  app.append(todo);
  const all=$("section","card");all.append($("h3",null,"Todas as seções"));
  p.s.forEach((x,i)=>{const r=$("div","row");
    r.append($("span",null,String(i+1).padStart(2,"0")+" "+SEC[i]),$("span","tag "+(x[0]||"n").toLowerCase(),x[0]?DEC[x[0]][1]:"Não avaliada"));all.append(r);});
  app.append(all);
  const a=$("div","acts"),cp=$("button","send","Copiar relatório"),pr=$("button","ghost","Imprimir ou salvar em PDF"),ls=$("button","ghost","Ver todas as avaliações"),bk=$("button","ghost","Voltar à avaliação");
  cp.onclick=()=>copy(report(p),cp);pr.onclick=()=>print();ls.onclick=()=>{location.hash="resultados";};bk.onclick=()=>{location.hash="";};
  a.append(cp,pr,ls,bk);app.append(a);
}
function viewList(){
  bar.style.display="none";app.textContent="";scrollTo(0,0);
  const h=$("div","intro"),l=load();
  h.append($("h1",null,"Avaliações recebidas"),$("p",null,"Ficam guardadas neste navegador cada vez que você abre um link de resultado."));
  app.append(h);
  if(!l.length)app.append($("section","card mut","Nenhuma avaliação guardada ainda. Abra o link que o cliente enviar pelo WhatsApp."));
  l.forEach(p=>{const c=count(p),b=$("button","card item");
    b.append($("b",null,p.n||"Cliente sem nome"),$("span","mut",when(p.t)+" · 👍 "+c.M+" · ✏️ "+c.A+" · 🗑 "+c.R));
    b.onclick=()=>{location.hash="r="+enc(p);};app.append(b);});
  const bk=$("button","ghost","Voltar à avaliação");bk.onclick=()=>{location.hash="";};
  const a=$("div","acts");a.append(bk);app.append(a);
}
function route(){
  const h=location.hash;
  if(h.startsWith("#r=")){let p=null;try{p=dec(h.slice(3));}catch(e){}
    if(p&&Array.isArray(p.s)&&p.s.length===SEC.length){save(p);return viewResult(p);}
    app.textContent="";bar.style.display="none";
    const c=$("section","card","Este link de resultado está incompleto. Peça ao cliente para enviar de novo.");app.append(c);return;}
  if(h==="#resultados")return viewList();
  viewForm();
}
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
