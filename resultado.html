<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Resultado das avaliações | EcoCidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<style>
body{background:#f3f6ef}.rs-header{background:#fff;border-bottom:1px solid #e0e8df;padding:16px 0}
.rs-header .container{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.rs-main{padding:40px 0 75px}.rs-title{font-size:clamp(26px,4vw,36px);color:#174d3b;margin-bottom:6px}.rs-sub{font-size:13px;color:#687a70;margin-bottom:22px}
.rs-login{background:#fff;border:1px solid #e0e8df;border-radius:12px;padding:26px;max-width:420px}
.rs-login label{display:block;font-size:11px;font-weight:700;color:#41564a;margin-bottom:7px}
.rs-login input{width:100%;border:1px solid #dfe7df;border-radius:8px;padding:12px;font:13px "DM Sans";margin-bottom:14px}
.rs-error{color:#b3412f;font-size:12px;min-height:16px;margin-top:10px}
.rs-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.rs-box{background:#fff;border:1px solid #e0e8df;border-radius:12px;padding:20px;margin-bottom:14px}
.rs-box h2{font-size:15px;color:#174d3b;margin-bottom:12px}
.rs-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.rs-stat{background:#fff;border:1px solid #e0e8df;border-radius:10px;padding:14px}.rs-stat b{display:block;font:800 26px Manrope;color:#174d3b}.rs-stat span{font-size:11px;color:#687a70}
.rs-table{width:100%;border-collapse:collapse;font-size:12px}.rs-table th,.rs-table td{padding:8px 6px;text-align:center;border-bottom:1px solid #eef2ec}.rs-table th:first-child,.rs-table td:first-child{text-align:left}.rs-table th{color:#687a70;font-size:10px;letter-spacing:.06em}
.rs-wrap{overflow-x:auto}
.rs-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.rs-head h3{font-size:17px;color:#174d3b}.rs-meta{font-size:11px;color:#687a70;margin-top:3px}
.rs-item{padding:11px 0;border-top:1px solid #eef2ec}.rs-item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.rs-item-top strong{font-size:13px;color:#1d3028}
.rs-comment{font-size:12px;color:#53645a;margin-top:6px;white-space:pre-wrap}
.badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap}
.b-manter{background:#e3f1e0;color:#1f6a45}.b-modificar{background:#fdf0dc;color:#9a6218}.b-retirar{background:#fbe4df;color:#b3412f}.b-adicionar{background:#dfeef0;color:#2f6f7a}.b-nao{background:#eef0ee;color:#7a877f}
.rs-ideas{background:#f3f6ef;border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;margin-top:12px}
.rs-empty{color:#687a70;font-size:13px;padding:30px 0;text-align:center}
.hidden{display:none}

@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff !important; color: #17251e; }
  .rs-header, .rs-toolbar, .rs-head button, a.btn { display: none !important; }
  .rs-main { padding: 0 !important; }
  .container { width: 100% !important; max-width: none !important; }
  .rs-title { font-size: 24px; margin-top: 0; }
  .rs-sub { margin-bottom: 14px; }
  .rs-box, .rs-stat { break-inside: avoid; box-shadow: none !important; border: 1px solid #ccd8ce; }
  .rs-summary { grid-template-columns: repeat(5, 1fr); }
  .rs-stat { padding: 8px; }
  .rs-stat b { font-size: 19px; }
  .rs-table { font-size: 10px; }
  .rs-item { break-inside: avoid; }
  .rs-comment, .rs-ideas { color: #222 !important; }
}
</style></head>
<body>
<header class="rs-header"><div class="container">
<a class="brand" href="index.html"><img class="brand-logo" src="img/logo-ecocidade.svg" alt="Logo EcoCidade"><span class="brand-name">eco<span class="brand-light">cidade</span><small>GESTÃO DE RESÍDUOS</small></span></a>
<a class="btn btn-outline" href="feedback.html">← Voltar à avaliação</a>
</div></header>
<main class="rs-main"><div class="container">
<h1 class="rs-title">Resultado das avaliações</h1>
<p class="rs-sub">Veja aqui tudo o que os clientes enviaram. </p>



<section id="panel">
<div class="rs-toolbar">
<button class="btn btn-dark" id="refreshBtn" type="button">Atualizar</button>
<button class="btn btn-outline" id="downloadBtn" type="button">Exportar relatório em PDF</button>
</div>
<div id="summary"></div>
<div id="list"></div>
</section>
</div></main>
<script src="js/resultado.js"></script>
</body></html>
