services:
  - type: web
    name: ecocidade-avaliacoes
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: ecocidade-avaliacoes-data
      mountPath: /var/data
      sizeGB: 1
